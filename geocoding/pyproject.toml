[project]
name = "goal100-geocoding"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.poetry.dependencies]
pandas = ">=2.2"
requests = ">=2.34.2,<3.0.0"
geopandas = ">=1.1.4,<2.0.0"
nominatim-api = ">=5.3.2,<6.0.0"
gspread = ">=6.2.1,<7.0.0"
gspread-dataframe = ">=4.0.0,<5.0.0"
pyrosm = ">=0.12.0,<0.13.0"
streamlit = ">=1.60.0,<2.0.0"
rapidfuzz = ">=3.0,<4.0"
cursor-sdk = ">=1.0.26,<2.0.0"
jsonextractor = ">=0.0.2,<0.0.3"
numind = ">=0.3.0,<0.4.0"
dvc = ">=3.67.1,<4.0.0"
ollama = "^0.6.2"
torch = { version = "^2.13.0", source = "pytorch-cu126" }
transformers = "^5.14.1"
sentence-transformers = "^5.7.0"
datasets = "^5.0.1"
accelerate = ">=1.1.0"

[tool.poetry]
packages = [{ include = "lib" }]

[tool.setuptools.packages.find]
include = ["lib", "lib.*"]

