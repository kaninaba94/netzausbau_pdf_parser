name: pytest

"on":
  push:
    branches:
      - main
  pull_request:


jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dev dependencies
        run: poetry install --with dev --no-interaction --no-root

      - name: Run pytest
        run: poetry run pytest

