name: deptry

"on":
  push:
    branches:
      - main
  pull_request:

jobs:
  deptry:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --with dev --no-interaction --no-root

      - name: Run deptry table_extraction
        if: ${{ always() }}
        run: poetry run deptry table_extraction

      - name: Run deptry geocoding
        if: ${{ always() }}
        run: poetry run deptry geocoding
