[project]
name = "netzausbauplaene"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.poetry]
package-mode = false
packages = [{ include = "lib" }]

[tool.poetry.group.geocoding]
optional = true

[tool.poetry.group.table_extraction]
optional = true

[tool.poetry.group.geocoding.dependencies]
goal100-geocoding = { path = "geocoding", develop = true }

[tool.poetry.group.table_extraction.dependencies]
goal100-table-extraction = { path = "table_extraction", develop = true }

[tool.poetry.group.dev.dependencies]
ipython = ">=9.14,<10"
pyperclip = ">=1.11,<2"
mypy = ">=2.1,<3"
ruff = ">=0.15.17,<0.16"
basedpyright = ">=1.39.9,<2"
deptry = ">=0.25.1,<0.26"
types-geopandas = ">=1.1.4.20260728,<2"
types-tqdm = ">=4.70.0.20260805,<5"

[tool.ruff]
line-length = 120

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
show_error_codes = true
no_implicit_optional = true
exclude = [
    '(^|/)ipython_snippets/',
]

[[tool.mypy.overrides]]
module = ["pyrosm.*"]
ignore_missing_imports = true


[[tool.poetry.source]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
priority = "explicit"
