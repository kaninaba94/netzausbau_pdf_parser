[project]
name = "netzausbauplaene"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.poetry.group.geocoding]
optional = true

[tool.poetry.group.geocoding.dependencies]
goal100-geocoding = { path = "geocoding", develop = true }
pandas = ">=2.2"
requests = ">=2.34.2,<3.0.0"
geopandas = ">=1.1.4,<2.0.0"
nominatim-api = ">=5.3.2,<6.0.0"
gspread = ">=6.2.1,<7.0.0"
gspread-dataframe = ">=4.0.0,<5.0.0"
pyrosm = ">=0.12.0,<0.13.0"
streamlit = ">=1.60.0,<2.0.0"
rapidfuzz = ">=3.0,<4.0"
cursor-sdk = ">=1.0.26,<2.0.0"
jsonextractor = ">=0.0.2,<0.0.3"
numind = ">=0.3.0,<0.4.0"
dvc = ">=3.67.1,<4.0.0"
ollama = "^0.6.2"
torch = { version = "^2.13.0", source = "pytorch-cu126" }
transformers = "^5.14.1"
sentence-transformers = "^5.7.0"
datasets = "^5.0.1"
accelerate = ">=1.1.0"
numpy = "^2.5.2"
tqdm = "^4.70.0"
pydantic = "^2.13.4"

[tool.poetry.group.table_extraction]
optional = true

[tool.poetry.group.table_extraction.dependencies]
pymupdf = ">=1.24"
pdfplumber = { git = "https://github.com/jsvine/pdfplumber.git", rev = "c58dfb5e598ec6375e7c1119b81bd64f05829484" }
pandas = ">=2.2"
vnbdigital-client = ">=0.4.6,<0.5.0"
requests = ">=2.34.2,<3.0.0"
streamlit = { version = ">=1.59.2,<2.0.0", extras = ["pdf"] }
pillow = ">=12.3.0,<13.0.0"


[tool.poetry.group.dev.dependencies]
ipython = ">=9.14,<10"
pyperclip = ">=1.11,<2"
mypy = ">=2.1,<3"
ruff = ">=0.15.17,<0.16"
basedpyright = ">=1.39.9,<2"
deptry = ">=0.25.1,<0.26"
types-geopandas = ">=1.1.4.20260728,<2"
types-tqdm = ">=4.70.0.20260805,<5"
pytest = "^9.1.1"


[[tool.poetry.source]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
priority = "explicit"

[tool.ruff]
line-length = 120

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
show_error_codes = true
no_implicit_optional = true
exclude = [
    '(^|/)ipython_snippets/',
]

[[tool.mypy.overrides]]
module = ["pyrosm.*"]
ignore_missing_imports = true

[tool.deptry]
extend_exclude = [".*/ipython_snippets"]
non_dev_dependency_groups = [
  "geocoding",
  "table_extraction"
]
ignore = ["DEP004"]
