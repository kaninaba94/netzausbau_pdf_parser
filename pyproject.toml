[project]
name = "netzausbauplaene"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[project.optional-dependencies]
geocoding = [
    "pandas>=2.2",
    "requests>=2.34.2,<3.0.0",
    "geopandas>=1.1.4,<2.0.0",
    "nominatim-api>=5.3.2,<6.0.0",
    "gspread>=6.2.1,<7.0.0",
    "gspread-dataframe>=4.0.0,<5.0.0",
    "pyrosm>=0.12.0,<0.13.0",
    "streamlit>=1.60.0,<2.0.0",
    "rapidfuzz>=3.0,<4.0",
    "cursor-sdk>=1.0.26,<2.0.0",
    "jsonextractor>=0.0.2,<0.0.3",
    "numind>=0.3.0,<0.4.0",
    "dvc>=3.67.1,<4.0.0",
    "ollama>=0.6.2,<0.7.0",
    "torch>=2.13.0,<3.0.0",
    "transformers>=5.14.1,<6.0.0",
    "sentence-transformers>=5.7.0,<6.0.0",
    "datasets>=5.0.1,<6.0.0",
    "accelerate>=1.1.0",
]

table_extraction = [
    "pymupdf>=1.24",
    "pdfplumber @ git+https://github.com/jsvine/pdfplumber.git@c58dfb5e598ec6375e7c1119b81bd64f05829484",
    "pandas>=2.2",
    "vnbdigital-client>=0.4.6,<0.5.0",
    "requests>=2.34.2,<3.0.0",
    "streamlit[pdf]>=1.59.2,<2.0.0",
    "pillow>=12.3.0,<13.0.0",
]

[tool.poetry.dependencies]
torch = { markers = "extra == 'geocoding'", source = "pytorch-cu126" }

[tool.poetry]
package-mode = false


[tool.poetry.group.dev.dependencies]
ipython = ">=9.14,<10"
pyperclip = ">=1.11,<2"
mypy = ">=2.1,<3"
ruff = ">=0.15.17,<0.16"
basedpyright = ">=1.39.9,<2"
deptry = ">=0.25.1,<0.26"
types-geopandas = ">=1.1.4.20260728,<2"
types-tqdm = ">=4.70.0.20260805,<5"


[[tool.poetry.source]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
priority = "explicit"

[tool.ruff]
line-length = 120

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
show_error_codes = true
no_implicit_optional = true
exclude = [
    '(^|/)ipython_snippets/',
]

[[tool.mypy.overrides]]
module = ["pyrosm.*"]
ignore_missing_imports = true
